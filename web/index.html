<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>商品目录</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #222;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 顶部 */
        .header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #ffffff;
            padding: 14px 15px 10px;
            border-bottom: 1px solid #eeeeee;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* 搜索 */
        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 42px;
            border: 1px solid #dddddd;
            border-radius: 22px;
            padding: 0 18px;
            font-size: 15px;
            outline: none;
            background: #f7f7f7;
        }

        .search-box input:focus {
            border-color: #999999;
            background: #ffffff;
        }

        /* 分类 */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 15px;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
            scrollbar-width: none;
            position: sticky;
            top: 89px;
            z-index: 15;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            flex: 0 0 auto;
            border: 1px solid #dddddd;
            background: #ffffff;
            color: #555555;
            border-radius: 18px;
            padding: 7px 14px;
            font-size: 14px;
            white-space: nowrap;
        }

        .category-btn.active {
            background: #222222;
            color: #ffffff;
            border-color: #222222;
        }

        /* 商品区域 */
        .content {
            padding: 12px;
        }

        .status {
            font-size: 13px;
            color: #888888;
            margin: 2px 4px 12px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        /* 商品卡片 */
        .product-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 5px rgba(0,0,0,0.06);
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #eeeeee;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999999;
            font-size: 14px;
            background: #eeeeee;
        }

        .product-info {
            padding: 10px;
        }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            min-height: 42px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-code {
            margin-top: 5px;
            color: #999999;
            font-size: 12px;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
        }

        .price {
            font-size: 15px;
            font-weight: 700;
        }

        .stock {
            color: #888888;
            font-size: 12px;
        }

        /* 没有商品 */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999999;
            font-size: 15px;
        }

        /* 加载 */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888888;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 18px 18px 0 0;
            padding: 18px;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-close {
            float: right;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: #eeeeee;
            font-size: 20px;
        }

        .detail-image {
            width: 100%;
            max-height: 380px;
            object-fit: contain;
            border-radius: 12px;
            background: #f3f3f3;
            margin-bottom: 15px;
        }

        .detail-name {
            font-size: 22px;
            font-weight: 700;
            margin: 5px 40px 10px 0;
        }

        .detail-row {
            padding: 8px 0;
            border-bottom: 1px solid #eeeeee;
            font-size: 14px;
        }

        .detail-label {
            color: #888888;
            margin-right: 8px;
        }

        .detail-description {
            margin-top: 15px;
            color: #555555;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* 按钮 */
        .main-btn {
            width: 100%;
            height: 46px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: #222222;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
        }

        .main-btn:active {
            opacity: 0.8;
        }

        /* 表单 */
        .form-title {
            font-size: 20px;
            font-weight: 700;
            margin: 5px 40px 18px 0;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #555555;
            margin: 12px 0 6px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            border: 1px solid #dddddd;
            border-radius: 9px;
            padding: 11px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* 提示 */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 35px;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 300;
            display: none;
            max-width: 85%;
            text-align: center;
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 380px) {
            .products {
                gap: 8px;
            }

            .content {
                padding: 8px;
            }

            .product-info {
                padding: 8px;
            }

            .product-name {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <div class="header">
        <div class="title">商品目录</div>

        <div class="search-box">
            <input
                id="searchInput"
                type="search"
                placeholder="搜索商品名称、编号..."
                autocomplete="off"
            >
        </div>
    </div>

    <!-- 分类 -->
    <div id="categories" class="categories">
        <button class="category-btn active" data-category="all">
            全部
        </button>
    </div>

    <!-- 商品 -->
    <div class="content">

        <div id="status" class="status">
            正在加载商品...
        </div>

        <div id="products" class="products"></div>

        <div id="empty" class="empty" style="display:none;">
            没有找到商品
        </div>

        <div id="loading" class="loading" style="display:none;">
            正在加载...
        </div>

    </div>
</div>


<!-- 商品详情弹窗 -->
<div id="detailModal" class="modal">

    <div class="modal-box">

        <button class="modal-close" onclick="closeDetail()">
            ×
        </button>

        <div id="detailContent"></div>

    </div>
</div>


<!-- 询价弹窗 -->
<div id="inquiryModal" class="modal">

    <div class="modal-box">

        <button class="modal-close" onclick="closeInquiry()">
            ×
        </button>

        <div class="form-title">
            商品询价
        </div>

        <div id="inquiryProductName"
             style="font-size:15px;color:#555;margin-bottom:15px;">
        </div>

        <label class="form-label">
            联系方式
        </label>

        <input
            id="contactInput"
            class="form-input"
            type="text"
            placeholder="请输入微信/手机号/Telegram"
        >

        <label class="form-label">
            询价内容
        </label>

        <textarea
            id="messageInput"
            class="form-textarea"
            placeholder="请输入您的需求，例如：需要10件，请报价"
        ></textarea>

        <button
            class="main-btn"
            onclick="submitInquiry()">
            提交询价
        </button>

    </div>
</div>


<!-- 提示 -->
<div id="toast" class="toast"></div>


<script>

    /* =========================
       Telegram 小程序初始化
    ========================= */

    let tg = null;

    if (window.Telegram && window.Telegram.WebApp) {

        tg = window.Telegram.WebApp;

        tg.ready();

        tg.expand();

        try {
            tg.enableClosingConfirmation();
        } catch (e) {}

    }


    /* =========================
       全局变量
    ========================= */

    let allProducts = [];

    let currentCategory = "all";

    let currentProduct = null;


    /* =========================
       页面初始化
    ========================= */

    document.addEventListener("DOMContentLoaded", function () {

        loadProducts();

        const searchInput =
            document.getElementById("searchInput");

        searchInput.addEventListener("input", function () {

            renderProducts();

        });

    });


    /* =========================
       加载商品
    ========================= */

    async function loadProducts() {

        setStatus("正在加载商品...");

        try {

            const response =
                await fetch("/api/products", {
                    method: "GET",
                    cache: "no-store"
                });

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }

            const data = await response.json();

            if (!Array.isArray(data)) {

                throw new Error(
                    "商品数据格式错误"
                );

            }

            allProducts = data;

            renderCategories();

            renderProducts();

            setStatus(
                "共 " + allProducts.length + " 个商品"
            );

        } catch (error) {

            console.error(error);

            setStatus("商品加载失败");

            showToast(
                "商品加载失败，请检查服务器"
            );

        }

    }


    /* =========================
       分类
    ========================= */

    function renderCategories() {

        const box =
            document.getElementById("categories");

        box.innerHTML = "";

        const allBtn =
            document.createElement("button");

        allBtn.className =
            "category-btn active";

        allBtn.dataset.category =
            "all";

        allBtn.textContent =
            "全部";

        allBtn.onclick = function () {

            selectCategory("all");

        };

        box.appendChild(allBtn);


        const categories = [];

        allProducts.forEach(function (product) {

            const category =
                product.category_name ||
                product.category ||
                "";

            if (
                category &&
                !categories.includes(category)
            ) {

                categories.push(category);

            }

        });


        categories.forEach(function (category) {

            const btn =
                document.createElement("button");

            btn.className =
                "category-btn";

            btn.dataset.category =
                category;

            btn.textContent =
                category;

            btn.onclick = function () {

                selectCategory(category);

            };

            box.appendChild(btn);

        });

    }


    function selectCategory(category) {

        currentCategory =
            category;

        document
            .querySelectorAll(".category-btn")
            .forEach(function (btn) {

                btn.classList.toggle(
                    "active",
                    btn.dataset.category === category
                );

            });

        renderProducts();

    }


    /* =========================
       商品筛选
    ========================= */

    function getFilteredProducts() {

        const keyword =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        return allProducts.filter(function (product) {

            const category =
                product.category_name ||
                product.category ||
                "";


            const name =
                String(product.name || "")
                    .toLowerCase();

            const code =
                String(product.code || "")
                    .toLowerCase();

            const description =
                String(product.description || "")
                    .toLowerCase();


            const categoryMatch =
                currentCategory === "all" ||
                category === currentCategory;


            const searchMatch =
                !keyword ||
                name.includes(keyword) ||
                code.includes(keyword) ||
                description.includes(keyword);


            return categoryMatch &&
                   searchMatch;

        });

    }


    /* =========================
       显示商品
    ========================= */

    function renderProducts() {

        const container =
            document.getElementById("products");

        const empty =
            document.getElementById("empty");


        const products =
            getFilteredProducts();


        container.innerHTML = "";


        if (products.length === 0) {

            empty.style.display =
                "block";

            setStatus("没有找到商品");

            return;

        }


        empty.style.display =
            "none";


        setStatus(
            "显示 " +
            products.length +
            " 个商品"
        );


        products.forEach(function (product) {

            const card =
                createProductCard(product);

            container.appendChild(card);

        });

    }


    /* =========================
       创建商品卡片
    ========================= */

    function createProductCard(product) {

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        /* 图片 */

        const imageBox =
            document.createElement("div");

        imageBox.className =
            "product-image";


        if (product.photo_url) {

            const img =
                document.createElement("img");

            img.src =
                product.photo_url;

            img.alt =
                product.name || "商品";

            img.loading =
                "lazy";


            img.onerror =
                function () {

                    imageBox.innerHTML = "";

                    const placeholder =
                        document.createElement("div");

                    placeholder.className =
                        "image-placeholder";

                    placeholder.textContent =
                        "暂无图片";

                    imageBox.appendChild(
                        placeholder
                    );

                };


            imageBox.appendChild(img);

        } else {

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "image-placeholder";

            placeholder.textContent =
                "暂无图片";

            imageBox.appendChild(
                placeholder
            );

        }


        /* 商品信息 */

        const info =
            document.createElement("div");

        info.className =
            "product-info";


        const name =
            document.createElement("div");

        name.className =
            "product-name";

        name.textContent =
            product.name || "未命名商品";


        const code =
            document.createElement("div");

        code.className =
            "product-code";

        code.textContent =
            product.code
                ? "编号：" + product.code
                : "";


        const bottom =
            document.createElement("div");

        bottom.className =
            "product-bottom";


        const price =
            document.createElement("div");

        price.className =
            "price";

        price.textContent =
            formatPrice(product.price);


        const stock =
            document.createElement("div");

        stock.className =
            "stock";

        if (
            product.stock !== undefined &&
            product.stock !== null
        ) {

            stock.textContent =
                "库存 " + product.stock;

        }


        bottom.appendChild(price);

        bottom.appendChild(stock);


        info.appendChild(name);

        info.appendChild(code);

        info.appendChild(bottom);


        card.appendChild(imageBox);

        card.appendChild(info);


        card.onclick =
            function () {

                openDetail(product);

            };


        return card;

    }


    /* =========================
       商品详情
    ========================= */

    function openDetail(product) {

        currentProduct =
            product;


        const container =
            document.getElementById(
                "detailContent"
            );


        container.innerHTML = "";


        /* 关闭按钮占位 */

        const image =
            document.createElement("img");

        image.className =
            "detail-image";


        if (product.photo_url) {

            image.src =
                product.photo_url;

            image.alt =
                product.name || "商品";

            image.onerror =
                function () {

                    this.style.display =
                        "none";

                };

        } else {

            image.style.display =
                "none";

        }


        const name =
            document.createElement("div");

        name.className =
            "detail-name";

        name.textContent =
            product.name || "未命名商品";


        container.appendChild(image);

        container.appendChild(name);


        addDetailRow(
            container,
            "编号",
            product.code
        );


        addDetailRow(
            container,
            "分类",
            product.category_name ||
            product.category
        );


        addDetailRow(
            container,
            "价格",
            formatPrice(product.price)
        );


        if (
            product.stock !== undefined &&
            product.stock !== null
        ) {

            addDetailRow(
                container,
                "库存",
                product.stock
            );

        }


        if (product.description) {

            const description =
                document.createElement("div");

            description.className =
                "detail-description";

            description.textContent =
                product.description;

            container.appendChild(
                description
            );

        }


        const inquiryButton =
            document.createElement("button");

        inquiryButton.className =
            "main-btn";

        inquiryButton.textContent =
            "立即询价";

        inquiryButton.onclick =
            function () {

                closeDetail();

                openInquiry(product);

            };


        container.appendChild(
            inquiryButton
        );


        document
            .getElementById("detailModal")
            .classList.add("show");

    }


    function addDetailRow(
        container,
        label,
        value
    ) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {

            return;

        }


        const row =
            document.createElement("div");

        row.className =
            "detail-row";


        const labelSpan =
            document.createElement("span");

        labelSpan.className =
            "detail-label";

        labelSpan.textContent =
            label + "：";


        const valueSpan =
            document.createElement("span");

        valueSpan.textContent =
            value;


        row.appendChild(labelSpan);

        row.appendChild(valueSpan);


        container.appendChild(row);

    }


    function closeDetail() {

        document
            .getElementById("detailModal")
            .classList.remove("show");

    }


    /* =========================
       询价
    ========================= */

    function openInquiry(product) {

        currentProduct =
            product;


        document
            .getElementById(
                "inquiryProductName"
            )
            .textContent =
                "商品：" +
                (product.name || "");


        document
            .getElementById(
                "contactInput"
            )
            .value = "";


        document
            .getElementById(
                "messageInput"
            )
            .value = "";


        document
            .getElementById(
                "inquiryModal"
            )
            .classList.add("show");

    }


    function closeInquiry() {

        document
            .getElementById(
                "inquiryModal"
            )
            .classList.remove("show");

    }


    async function submitInquiry() {

        if (!currentProduct) {

            showToast(
                "请选择商品"
            );

            return;

        }


        const contact =
            document
                .getElementById(
                    "contactInput"
                )
                .value
                .trim();


        const message =
            document
                .getElementById(
                    "messageInput"
                )
                .value
                .trim();


        if (!contact && !message) {

            showToast(
                "请填写联系方式或询价内容"
            );

            return;

        }


        const fullMessage =
            "联系方式：" +
            (contact || "未填写") +
            "\n询价内容：" +
            (message || "未填写");


        try {

            const response =
                await fetch(
                    "/api/inquiry",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            product:
                                currentProduct.name,

                            message:
                                fullMessage

                        })

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "提交失败"
                );

            }


            closeInquiry();


            showToast(
                "询价已提交"
            );


            if (
                tg &&
                tg.HapticFeedback
            ) {

                try {

                    tg.HapticFeedback
                        .notificationOccurred(
                            "success"
                        );

                } catch (e) {}

            }


        } catch (error) {

            console.error(error);

            showToast(
                "提交失败，请稍后再试"
            );

        }

    }


    /* =========================
       工具函数
    ========================= */

    function formatPrice(price) {

        if (
            price === undefined ||
            price === null ||
            price === ""
        ) {

            return "询价";

        }


        const text =
            String(price);


        if (
            text.includes("¥") ||
            text.includes("￥") ||
            text.includes("询价")
        ) {

            return text;

        }


        return "¥" + text;

    }


    function setStatus(text) {

        document
            .getElementById("status")
            .textContent =
                text;

    }


    function showToast(text) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            text;


        toast.classList.add(
            "show"
        );


        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

    }


    /* =========================
       点击弹窗外部关闭
    ========================= */

    document
        .getElementById("detailModal")
        .addEventListener(
            "click",
            function (event) {

                if (
                    event.target === this
                ) {

                    closeDetail();

                }

            }
        );


    document
        .getElementById("inquiryModal")
        .addEventListener(
            "click",
            function (event) {

                if (
                    event.target === this
                ) {

                    closeInquiry();

                }

            }
        );

</script>

</body>
</html>
