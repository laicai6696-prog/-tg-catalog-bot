<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>商品目录</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f5f6f8;
  color:#1f2937;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding-bottom:60px;
}

/* 顶部 */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    10px;
  border-bottom:1px solid #e5e7eb;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.title{
  font-size:22px;
  font-weight:800;
  line-height:1.2;
}

.subtitle{
  margin-top:4px;
  font-size:12px;
  color:#8a8f98;
}

.search-wrap{
  position:relative;
}

.search{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:0 42px 0 14px;
  background:#f9fafb;
  color:#111827;
  font-size:15px;
  outline:none;
}

.search:focus{
  background:#fff;
  border-color:#9ca3af;
}

.search-clear{
  position:absolute;
  right:8px;
  top:6px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#e5e7eb;
  color:#555;
  display:none;
}

.search-clear.show{
  display:block;
}

/* 分类 */
.cats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 0 2px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.cats::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  border:1px solid #ddd;
  background:#fff;
  color:#333;
  border-radius:20px;
  padding:7px 13px;
  font-size:13px;
  white-space:nowrap;
}

.cat.active{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* 工具栏 */
.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px;
}

.count{
  font-size:13px;
  color:#6b7280;
}

.bar-right{
  display:flex;
  gap:8px;
}

.refresh{
  border:0;
  background:#fff;
  color:#333;
  border-radius:10px;
  padding:8px 12px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

/* 商品网格 */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:0 12px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 1px 5px rgba(0,0,0,.07);
  min-width:0;
}

.image-box{
  width:100%;
  aspect-ratio:1/1;
  background:#f0f1f3;
  position:relative;
  overflow:hidden;
}

.pic{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.nop{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
}

.body{
  padding:11px;
}

.name{
  font-size:15px;
  font-weight:700;
  line-height:1.4;
  min-height:42px;
  word-break:break-word;
}

.code{
  font-size:12px;
  color:#8a8f98;
  margin-top:3px;
}

.price{
  font-size:17px;
  font-weight:800;
  margin-top:8px;
  color:#111827;
}

.price.negotiable{
  font-size:15px;
}

.stock{
  font-size:12px;
  margin-top:5px;
  color:#16a34a;
}

.stock.out{
  color:#dc2626;
}

.stock.unknown{
  color:#8a8f98;
}

.desc{
  font-size:12px;
  color:#6b7280;
  margin-top:6px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:36px;
}

.btn{
  width:100%;
  margin-top:10px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:14px;
  font-weight:700;
}

.btn:disabled{
  opacity:.55;
}

/* 加载/空状态 */
.loading,
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#888;
}

.loading{
  padding-top:80px;
}

/* 商品详情 */
.detail-mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:30;
  padding:20px;
  overflow-y:auto;
}

.detail-mask.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.detail-modal{
  background:#fff;
  border-radius:20px;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
}

.detail-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f0f1f3;
}

.detail-content{
  padding:18px;
}

.detail-title{
  font-size:21px;
  font-weight:800;
  line-height:1.35;
}

.detail-code{
  font-size:13px;
  color:#888;
  margin-top:5px;
}

.detail-price{
  font-size:21px;
  font-weight:800;
  margin-top:12px;
}

.detail-stock{
  font-size:14px;
  margin-top:6px;
}

.detail-desc{
  font-size:14px;
  line-height:1.7;
  color:#555;
  margin-top:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.detail-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.detail-actions button{
  flex:1;
  height:44px;
  border:0;
  border-radius:11px;
  font-size:14px;
  font-weight:700;
}

.detail-close{
  background:#eee;
  color:#333;
}

.detail-inquiry{
  background:#111827;
  color:#fff;
}

/* 询价 */
.mask{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:40;
  padding:20px;
  align-items:flex-end;
  overflow-y:auto;
}

.mask.show{
  display:flex;
}

.modal{
  background:#fff;
  border-radius:20px 20px 14px 14px;
  width:100%;
  max-width:760px;
  margin:auto;
  padding:18px;
}

.modal h2{
  margin:0 0 8px;
  font-size:19px;
}

.info{
  font-size:13px;
  color:#666;
  line-height:1.7;
}

.textarea{
  width:100%;
  min-height:110px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  font-size:14px;
  resize:vertical;
  margin-top:12px;
  outline:none;
}

.textarea:focus{
  border-color:#9ca3af;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.actions button{
  flex:1;
  height:44px;
  border:0;
  border-radius:11px;
  font-size:14px;
  font-weight:700;
}

.cancel{
  background:#eee;
  color:#333;
}

.submit{
  background:#111827;
  color:#fff;
}

.submit:disabled{
  opacity:.55;
}

/* 提示 */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  display:none;
  z-index:100;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

/* 桌面 */
@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .detail-modal{
    max-height:85vh;
  }
}

/* 小屏 */
@media(max-width:420px){
  .grid{
    gap:9px;
    padding:0 9px;
  }

  .body{
    padding:9px;
  }

  .name{
    font-size:14px;
  }

  .price{
    font-size:16px;
  }

  .btn{
    height:37px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <header class="top">

    <div class="title-row">
      <div>
        <div class="title">🛍️ 商品目录</div>
        <div class="subtitle">选择商品 · 查看详情 · 在线询价</div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="search-wrap">
      <input
        id="search"
        class="search"
        placeholder="搜索商品名称、编号…"
        autocomplete="off"
        enterkeyhint="search"
      >
      <button
        id="searchClear"
        class="search-clear"
        type="button"
        onclick="clearSearch()"
      >×</button>
    </div>

    <!-- 分类 -->
    <div id="cats" class="cats"></div>

  </header>

  <!-- 工具栏 -->
  <div class="bar">
    <span id="count" class="count">正在加载…</span>

    <div class="bar-right">
      <button
        class="refresh"
        type="button"
        onclick="loadProducts()"
      >刷新</button>
    </div>
  </div>

  <!-- 商品 -->
  <main id="grid" class="grid">
    <div class="loading">商品加载中…</div>
  </main>

</div>


<!-- 商品详情弹窗 -->
<div id="detailMask" class="detail-mask">

  <div class="detail-modal">

    <div id="detailImageBox"></div>

    <div class="detail-content">

      <div id="detailTitle" class="detail-title"></div>

      <div id="detailCode" class="detail-code"></div>

      <div id="detailPrice" class="detail-price"></div>

      <div id="detailStock" class="detail-stock"></div>

      <div id="detailDesc" class="detail-desc"></div>

      <div class="detail-actions">

        <button
          class="detail-close"
          type="button"
          onclick="closeDetail()"
        >关闭</button>

        <button
          class="detail-inquiry"
          type="button"
          onclick="inquiryFromDetail()"
        >💬 立即询价</button>

      </div>

    </div>

  </div>

</div>


<!-- 询价弹窗 -->
<div id="mask" class="mask">

  <div class="modal">

    <h2 id="modalTitle">商品询价</h2>

    <div id="modalInfo" class="info"></div>

    <textarea
      id="message"
      class="textarea"
      placeholder="请输入询价内容，例如：需要多少、希望了解什么…"
    ></textarea>

    <div class="actions">

      <button
        class="cancel"
        type="button"
        onclick="closeModal()"
      >取消</button>

      <button
        class="submit"
        type="button"
        onclick="submitInquiry()"
      >提交询价</button>

    </div>

  </div>

</div>


<!-- 提示 -->
<div id="toast" class="toast"></div>


<script>
/* =========================================================
   Telegram Mini App
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){

  try{
    tg.ready();
    tg.expand();
  }catch(e){
    console.log(e);
  }

}


/* =========================================================
   全局状态
========================================================= */

const state = {

  products: [],

  categories: [],

  category: '',

  keyword: '',

  selected: null,

  detailProduct: null

};


/* =========================================================
   工具函数
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g,function(m){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[m];

    });

}


function showToast(text){

  const box = document.getElementById('toast');

  box.textContent = text;

  box.classList.add('show');

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(function(){

    box.classList.remove('show');

  },2500);

}


function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ''
  ){

    return '<span class="negotiable">价格面议</span>';

  }

  return '¥ ' + esc(value);

}


function getStockNumber(value){

  const n = Number(value);

  if(Number.isFinite(n)){

    return n;

  }

  return null;

}


function stockText(value){

  const n = getStockNumber(value);

  if(n === null){

    return '库存：' + esc(value ?? '未知');

  }

  if(n <= 0){

    return '暂时缺货';

  }

  return '库存：' + esc(value);

}


function stockClass(value){

  const n = getStockNumber(value);

  if(n === null){

    return 'stock unknown';

  }

  if(n <= 0){

    return 'stock out';

  }

  return 'stock';

}


/* =========================================================
   分类
========================================================= */

function renderCats(){

  const el = document.getElementById('cats');

  let html = '';

  html +=
    '<button class="cat ' +
    (!state.category ? 'active' : '') +
    '" type="button" onclick="selectCat(\'\')">' +
    '全部' +
    '</button>';

  state.categories.forEach(function(c){

    const id = c.id ?? '';

    const name = c.name ?? id;

    const count =
      Number(c.count) > 0
        ? ' (' + Number(c.count) + ')'
        : '';

    html +=
      '<button class="cat ' +
      (state.category === id ? 'active' : '') +
      '" type="button" ' +
      'onclick="selectCat(\'' +
      esc(id).replace(/'/g,"\\'") +
      '\')">' +
      esc(name) +
      esc(count) +
      '</button>';

  });

  el.innerHTML = html;

}


function selectCat(category){

  state.category = category;

  renderCats();

  loadProducts();

}


/* =========================================================
   搜索
========================================================= */

function updateSearchClear(){

  const input =
    document.getElementById('search');

  const clear =
    document.getElementById('searchClear');

  if(input.value.trim()){

    clear.classList.add('show');

  }else{

    clear.classList.remove('show');

  }

}


function clearSearch(){

  const input =
    document.getElementById('search');

  input.value = '';

  state.keyword = '';

  updateSearchClear();

  loadProducts();

}


/* =========================================================
   商品渲染
========================================================= */

function render(){

  const grid =
    document.getElementById('grid');

  document.getElementById('count').textContent =
    '共 ' + state.products.length + ' 个商品';


  if(!state.products.length){

    grid.innerHTML =
      '<div class="empty">' +
      '没有找到匹配商品' +
      '</div>';

    return;

  }


  grid.innerHTML =
    state.products.map(function(p){

      const stock =
        getStockNumber(p.stock);

      const out =
        stock !== null && stock <= 0;


      const photo =
        p.photo_url ||
        p.image_url ||
        '';


      let imageHTML = '';

      if(photo){

        imageHTML =
          '<img ' +
          'class="pic" ' +
          'loading="lazy" ' +
          'src="' + esc(photo) + '" ' +
          'alt="' + esc(p.name) + '" ' +
          'onerror="imageError(this)"' +
          '>';

      }else{

        imageHTML =
          '<div class="nop">暂无图片</div>';

      }


      return `

        <article class="card">

          <div class="image-box"
               onclick='openDetail(${JSON.stringify(p)})'>

            ${imageHTML}

          </div>

          <div class="body">

            <div
              class="name"
              onclick='openDetail(${JSON.stringify(p)})'
              style="cursor:pointer"
            >
              ${esc(p.name)}
            </div>

            <div class="code">
              ${esc(p.code || '')}
            </div>

            <div class="price">
              ${money(p.price)}
            </div>

            <div class="${stockClass(p.stock)}">
              ${stockText(p.stock)}
            </div>

            ${
              p.description
              ?
              '<div class="desc">' +
              esc(p.description) +
              '</div>'
              :
              '<div class="desc"></div>'
            }

            <button
              class="btn"
              type="button"
              onclick='openInquiry(${JSON.stringify(p)})'
            >
              💬 询价
            </button>

          </div>

        </article>

      `;

    }).join('');

}


function imageError(img){

  const box =
    img.parentElement;

  img.remove();

  box.innerHTML =
    '<div class="nop">暂无图片</div>';

}


/* =========================================================
   商品详情
========================================================= */

function openDetail(product){

  state.detailProduct = product;

  const imageBox =
    document.getElementById('detailImageBox');

  const title =
    document.getElementById('detailTitle');

  const code =
    document.getElementById('detailCode');

  const price =
    document.getElementById('detailPrice');

  const stock =
    document.getElementById('detailStock');

  const desc =
    document.getElementById('detailDesc');


  title.textContent =
    product.name || '商品';


  code.textContent =
    '编号：' + (product.code || '');


  price.innerHTML =
    money(product.price);


  stock.textContent =
    stockText(product.stock);

  stock.className =
    stockClass(product.stock);


  desc.textContent =
    product.description ||
    '暂无商品描述';


  const photo =
    product.photo_url ||
    product.image_url ||
    '';


  if(photo){

    imageBox.innerHTML =
      '<img class="detail-image" ' +
      'src="' + esc(photo) + '" ' +
      'alt="' + esc(product.name) + '" ' +
      'onerror="this.parentElement.innerHTML=\'<div class=&quot;nop&quot; style=&quot;height:100%;min-height:300px&quot;>暂无图片</div>\'">';

  }else{

    imageBox.innerHTML =
      '<div class="detail-image nop" ' +
      'style="min-height:300px">' +
      '暂无图片' +
      '</div>';

  }


  document
    .getElementById('detailMask')
    .classList.add('show');

}


function closeDetail(){

  document
    .getElementById('detailMask')
    .classList.remove('show');

  state.detailProduct = null;

}


function inquiryFromDetail(){

  if(!state.detailProduct){

    return;

  }

  const product =
    state.detailProduct;

  closeDetail();

  openInquiry(product);

}


/* =========================================================
   询价
========================================================= */

function openInquiry(product){

  state.selected = product;


  document.getElementById('modalTitle')
    .textContent =
      '商品询价';


  document.getElementById('modalInfo')
    .innerHTML =

      '<b>' +
      esc(product.name) +
      '</b>' +

      '<br>编号：' +
      esc(product.code || '') +

      '<br>价格：' +
      money(product.price) +

      '　' +

      stockText(product.stock);


  document.getElementById('message')
    .value = '';


  document
    .getElementById('mask')
    .classList.add('show');


  setTimeout(function(){

    document
      .getElementById('message')
      .focus();

  },80);

}


function closeModal(){

  document
    .getElementById('mask')
    .classList.remove('show');

  state.selected = null;

}


/* =========================================================
   获取 Telegram 用户
========================================================= */

function getTelegramUser(){

  let user_id = null;

  let username = '';

  let first_name = '';

  let last_name = '';


  try{

    if(
      tg &&
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
    ){

      const user =
        tg.initDataUnsafe.user;

      user_id =
        user.id || null;

      username =
        user.username || '';

      first_name =
        user.first_name || '';

      last_name =
        user.last_name || '';

    }

  }catch(e){

    console.log(e);

  }


  return {

    user_id,

    username,

    first_name,

    last_name

  };

}


/* =========================================================
   提交询价
========================================================= */

async function submitInquiry(){

  if(!state.selected){

    return;

  }


  const btn =
    document.querySelector('.submit');


  const message =
    document
      .getElementById('message')
      .value
      .trim();


  btn.disabled = true;

  btn.textContent =
    '提交中…';


  const user =
    getTelegramUser();


  const product =
    state.selected;


  try{

    const response =
      await fetch(
        '/api/inquiry',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            product:
              product.name +
              ' [' +
              (product.code || '') +
              ']',

            product_id:
              product.id || null,

            code:
              product.code || '',

            message,

            user_id:
              user.user_id,

            username:
              user.username,

            first_name:
              user.first_name,

            last_name:
              user.last_name

          })

        }
      );


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.error ||
        '提交失败'
      );

    }


    closeModal();


    showToast(
      '✅ 询价已提交，请等待回复'
    );


    if(
      tg &&
      tg.HapticFeedback
    ){

      try{

        tg.HapticFeedback
          .notificationOccurred(
            'success'
          );

      }catch(e){}

    }


  }catch(error){

    console.error(error);

    showToast(
      '❌ 提交失败，请稍后重试'
    );


  }finally{

    btn.disabled = false;

    btn.textContent =
      '提交询价';

  }

}


/* =========================================================
   分类 API
========================================================= */

async function loadCategories(){

  try{

    const response =
      await fetch(
        '/api/categories',
        {
          cache:'no-store'
        }
      );


    const data =
      await response.json();


    if(
      data &&
      data.ok &&
      Array.isArray(
        data.categories
      )
    ){

      state.categories =
        data.categories;

      renderCats();

    }else{

      state.categories = [];

      renderCats();

    }


  }catch(error){

    console.error(
      '分类加载失败:',
      error
    );

    state.categories = [];

    renderCats();

  }

}


/* =========================================================
   商品 API
========================================================= */

async function loadProducts(){

  const grid =
    document.getElementById('grid');


  grid.innerHTML =
    '<div class="loading">' +
    '商品加载中…' +
    '</div>';


  const params =
    new URLSearchParams();


  /*
    只显示 active=1 的商品
    与最终版 Bot 后端保持一致
  */

  params.set(
    'active',
    '1'
  );


  if(state.category){

    params.set(
      'category',
      state.category
    );

  }


  const search =
    document
      .getElementById('search')
      .value
      .trim();


  state.keyword =
    search;


  updateSearchClear();


  if(search){

    params.set(
      'keyword',
      search
    );

  }


  try{

    const response =
      await fetch(
        '/api/products?' +
        params.toString(),
        {
          cache:'no-store'
        }
      );


    const data =
      await response.json();


    /*
      兼容两种 API：

      {
        ok:true,
        products:[]
      }

      或直接：

      []
    */

    if(
      data &&
      data.ok === false
    ){

      throw new Error(
        data.error ||
        '商品加载失败'
      );

    }


    if(
      Array.isArray(data)
    ){

      state.products =
        data;

    }else if(
      data &&
      Array.isArray(
        data.products
      )
    ){

      state.products =
        data.products;

    }else{

      state.products = [];

    }


    render();


  }catch(error){

    console.error(
      '商品加载失败:',
      error
    );


    document
      .getElementById('count')
      .textContent =
        '加载失败';


    grid.innerHTML =

      '<div class="empty">' +

      '商品加载失败' +

      '<br>' +

      '<button ' +
      'class="refresh" ' +
      'style="margin-top:12px" ' +
      'onclick="loadProducts()">' +

      '重新加载' +

      '</button>' +

      '</div>';

  }

}


/* =========================================================
   搜索事件
========================================================= */

let searchTimer = null;


document
  .getElementById('search')
  .addEventListener(
    'input',
    function(){

      updateSearchClear();

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          function(){

            loadProducts();

          },
          280
        );

    }
  );


/* =========================================================
   键盘回车
========================================================= */

document
  .getElementById('search')
  .addEventListener(
    'keydown',
    function(event){

      if(
        event.key === 'Enter'
      ){

        event.preventDefault();

        clearTimeout(
          searchTimer
        );

        loadProducts();

      }

    }
  );


/* =========================================================
   点击遮罩关闭
========================================================= */

document
  .getElementById('mask')
  .addEventListener(
    'click',
    function(event){

      if(
        event.target.id === 'mask'
      ){

        closeModal();

      }

    }
  );


document
  .getElementById('detailMask')
  .addEventListener(
    'click',
    function(event){

      if(
        event.target.id ===
        'detailMask'
      ){

        closeDetail();

      }

    }
  );


/* =========================================================
   ESC 关闭弹窗
========================================================= */

document
  .addEventListener(
    'keydown',
    function(event){

      if(
        event.key === 'Escape'
      ){

        closeModal();

        closeDetail();

      }

    }
  );


/* =========================================================
   初始化
========================================================= */

(async function(){

  await loadCategories();

  await loadProducts();

})();
</script>
