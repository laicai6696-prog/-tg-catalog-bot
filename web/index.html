<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>商品目录</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 10;
            background: white;
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .search {
            width: 100%;
            height: 44px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
        }

        .categories {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 12px 14px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .category {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 20px;
            background: #f1f1f1;
            font-size: 14px;
            cursor: pointer;
        }

        .category.active {
            background: #222;
            color: white;
        }

        .content {
            padding: 14px;
        }

        .count {
            font-size: 14px;
            color: #777;
            margin-bottom: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 1px 5px rgba(0,0,0,0.06);
            cursor: pointer;
        }

        .photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #eee;
        }

        .no-photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            color: #999;
            font-size: 13px;
        }

        .info {
            padding: 10px;
        }

        .name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
        }

        .code {
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }

        .price {
            margin-top: 8px;
            font-size: 17px;
            font-weight: 700;
        }

        .detail {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: white;
            overflow-y: auto;
        }

        .detail-top {
            position: sticky;
            top: 0;
            background: white;
            padding: 12px 14px;
            border-bottom: 1px solid #eee;
            z-index: 2;
        }

        .back {
            display: inline-block;
            padding: 6px 0;
            font-size: 16px;
            cursor: pointer;
        }

        .detail-photo {
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            background: #f5f5f5;
        }

        .detail-info {
            padding: 18px;
        }

        .detail-name {
            font-size: 24px;
            font-weight: 700;
        }

        .detail-price {
            margin-top: 12px;
            font-size: 22px;
            font-weight: 700;
        }

        .detail-row {
            margin-top: 10px;
            color: #666;
            font-size: 15px;
        }

        .description {
            margin-top: 20px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .inquiry-btn {
            width: 100%;
            margin-top: 24px;
            height: 48px;
            border: 0;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.45);
            align-items: flex-end;
        }

        .modal-box {
            width: 100%;
            background: white;
            border-radius: 18px 18px 0 0;
            padding: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .modal-input {
            width: 100%;
            min-height: 110px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            resize: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .modal-buttons button {
            flex: 1;
            height: 46px;
            border: 0;
            border-radius: 10px;
            font-size: 16px;
        }

        .cancel {
            background: #eee;
        }

        .submit {
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<div class="top">
    <div class="title">商品目录</div>

    <input
        id="search"
        class="search"
        placeholder="搜索商品名称或编号"
        autocomplete="off"
    >
</div>

<div id="categories" class="categories"></div>

<div class="content">
    <div id="count" class="count"></div>
    <div id="products" class="grid"></div>
</div>


<!-- 商品详情 -->
<div id="detail" class="detail">

    <div class="detail-top">
        <div
            class="back"
            onclick="closeDetail()"
        >
            ← 返回商品列表
        </div>
    </div>

    <div id="detailContent"></div>

</div>


<!-- 询价弹窗 -->
<div id="modal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            提交询价
        </div>

        <textarea
            id="inquiryText"
            class="modal-input"
            placeholder="请输入数量、规格或其他需求"
        ></textarea>

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeInquiry()"
            >
                取消
            </button>

            <button
                class="submit"
                onclick="submitInquiry()"
            >
                提交询价
            </button>

        </div>

    </div>

</div>


<script>

let products = [];
let currentCategory = "all";
let currentProduct = null;


/* =========================
   加载商品
========================= */

async function loadProducts() {

    const box = document.getElementById("products");

    box.innerHTML = `
        <div class="loading">
            正在加载商品...
        </div>
    `;

    try {

        const response = await fetch(
            "/api/products"
        );

        if (!response.ok) {
            throw new Error("商品接口错误");
        }

        products = await response.json();

        renderCategories();
        renderProducts();

    } catch (error) {

        console.error(error);

        box.innerHTML = `
            <div class="empty">
                商品加载失败，请稍后重试。
            </div>
        `;
    }
}


/* =========================
   分类
========================= */

function renderCategories() {

    const box =
        document.getElementById("categories");

    const categories = [];

    const map = {};

    products.forEach(product => {

        if (!map[product.category]) {

            map[product.category] = true;

            categories.push({
                id: product.category,
                name: product.category_name
            });
        }

    });

    let html = `
        <div
            class="category active"
            data-category="all"
            onclick="selectCategory('all')"
        >
            全部
        </div>
    `;

    categories.forEach(category => {

        html += `
            <div
                class="category"
                data-category="${escapeHtml(category.id)}"
                onclick="selectCategory('${escapeJs(category.id)}')"
            >
                ${escapeHtml(category.name)}
            </div>
        `;

    });

    box.innerHTML = html;
}


/* =========================
   选择分类
========================= */

function selectCategory(category) {

    currentCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(el => {

            el.classList.toggle(
                "active",
                el.dataset.category === category
            );

        });

    renderProducts();
}


/* =========================
   商品列表
========================= */

function renderProducts() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    let list = products.filter(product => {

        const categoryOK =
            currentCategory === "all"
            ||
            product.category === currentCategory;

        const searchOK =
            !search
            ||
            product.name
                .toLowerCase()
                .includes(search)
            ||
            product.code
                .toLowerCase()
                .includes(search);

        return categoryOK && searchOK;

    });

    const count =
        document.getElementById("count");

    count.textContent =
        `共 ${list.length} 个商品`;

    const box =
        document.getElementById("products");

    if (!list.length) {

        box.innerHTML = `
            <div class="empty">
                没有找到商品
            </div>
        `;

        return;
    }

    box.innerHTML = list.map(product => {

        let photo = "";

        if (product.photo_id) {

            /*
             * Telegram file_id不能直接给网页使用。
             * 没有网页图片URL时先显示占位。
             */

            photo = `
                <div class="no-photo">
                    商品图片
                </div>
            `;

        } else {

            photo = `
                <div class="no-photo">
                    暂无图片
                </div>
            `;

        }

        return `
            <div
                class="card"
                onclick="openDetail(${product.id})"
            >

                ${photo}

                <div class="info">

                    <div class="name">
                        ${escapeHtml(product.name)}
                    </div>

                    <div class="code">
                        编号：${escapeHtml(product.code)}
                    </div>

                    <div class="price">
                        ${formatPrice(product.price)}
                    </div>

                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   商品详情
========================= */

function openDetail(id) {

    currentProduct =
        products.find(
            product => product.id === id
        );

    if (!currentProduct) {
        return;
    }

    const detail =
        document.getElementById("detail");

    const content =
        document.getElementById("detailContent");

    let photo = `
        <div class="no-photo">
            暂无商品图片
        </div>
    `;

    content.innerHTML = `

        ${photo}

        <div class="detail-info">

            <div class="detail-name">
                ${escapeHtml(currentProduct.name)}
            </div>

            <div class="detail-price">
                ${formatPrice(currentProduct.price)}
            </div>

            <div class="detail-row">
                编号：${escapeHtml(currentProduct.code)}
            </div>

            <div class="detail-row">
                分类：${escapeHtml(currentProduct.category_name)}
            </div>

            <div class="detail-row">
                库存：${escapeHtml(String(currentProduct.stock))}
            </div>

            <div class="description">
                ${escapeHtml(
                    currentProduct.description || "暂无描述"
                )}
            </div>

            <button
                class="inquiry-btn"
                onclick="openInquiry()"
            >
                📩 提交询价
            </button>

        </div>
    `;

    detail.style.display = "block";

    window.scrollTo(
        0,
        0
    );
}


function closeDetail() {

    document.getElementById(
        "detail"
    ).style.display = "none";

    currentProduct = null;
}


/* =========================
   询价
========================= */

function openInquiry() {

    if (!currentProduct) {
        return;
    }

    document.getElementById(
        "inquiryText"
    ).value = "";

    document.getElementById(
        "modal"
    ).style.display = "flex";
}


function closeInquiry() {

    document.getElementById(
        "modal"
    ).style.display = "none";
}


async function submitInquiry() {

    if (!currentProduct) {
        return;
    }

    const text =
        document
            .getElementById("inquiryText")
            .value
            .trim();

    if (!text) {

        alert(
            "请填写数量或需求"
        );

        return;
    }

    try {

        const response = await fetch(
            "/api/inquiry",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    product:
                        currentProduct.name,
                    message: text
                })
            }
        );

        const result =
            await response.json();

        if (!result.ok) {

            alert(
                result.message ||
                "提交失败"
            );

            return;
        }

        closeInquiry();

        alert(
            "✅ 询价已提交"
        );

    } catch (error) {

        console.error(error);

        alert(
            "提交失败，请稍后重试"
        );
    }
}


/* =========================
   搜索
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderProducts
    );


/* =========================
   价格
========================= */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {
        return "询价";
    }

    const value =
        String(price);

    if (
        /^[0-9]+(\.[0-9]+)?$/.test(value)
    ) {
        return "¥" + value;
    }

    return escapeHtml(value);
}


/* =========================
   安全处理
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeJs(value) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
}


/* =========================
   启动
========================= */

loadProducts();

</script>

</body>
</html>
